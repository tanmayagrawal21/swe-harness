name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --python 3.12
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: Dry benchmark (reference must have zero gate-bypass merges)
        run: uv run swe-harness bench --jobs 8 --out runs/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-report
          path: |
            runs/ci/report.md
            runs/ci/results.json
